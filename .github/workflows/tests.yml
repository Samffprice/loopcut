# The checks that need no Blender, on every push: the agent loop, layout, persistence and the
# settings import. Only the tip of the history is fetched, and none of Blender's LFS files.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"  # The Python inside Blender 5.2.
      - run: python3 -m unittest discover -s loopcut/tests
