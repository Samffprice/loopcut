# The checks that need no Blender, on every push: the agent loop, layout, persistence and the
# settings import, plus that the fork patch and its base tag are present for the release build.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"  # The Python inside Blender 5.2.
      - run: python3 -m unittest discover -s tests
      - run: test -s patches/blender.patch && grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' patches/BASE
